[project]
name = "data-profiling-benchmark"
version = "0.1.0"
description = "DataXID vs Zarque profiling benchmark suite"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [{ name = "Elif", email = "" }]

dependencies = [
    "dataxid-profiling",
    "zarque-profiling",
    "polars>=1.0",
    "matplotlib>=3.7",
    "numpy>=1.21",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
